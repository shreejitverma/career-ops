# jobboard/companies.yml - company registry for the job board (jobboard.mjs).
#
# FORK-LOCAL. Declared in config/local-paths.txt so the updater never touches it.
#
# Each entry:
#   id       stable slug; job ids and your application state key off it - never rename
#   name     display name
#   type     HFT | Prop Trading | Hedge Fund | Asset Mgmt | Bank | Crypto |
#            Prediction Market | Exchange/Fintech
#   wsq      firm names used by thewallstreetquants.com/openings, so its postings
#            map onto this company (omit when WSQ does not list the firm)
#   boards   public ATS boards `jobboard.mjs scan` fetches through providers/
#            (Greenhouse, Lever, Ashby, Workday, Eightfold, Oracle Cloud, ...).
#            Empty means no scannable board: postings come from WSQ only and the
#            company still shows in the directory with its careers link.
#   website  careers page to open by hand
#   filter   all  = keep every posting that classifies as a tech/quant role (small
#                   quant firms, where nearly every role is relevant)
#            strict = also require a quant/C++/Python/AI signal in the title
#                   (large banks, asset managers and fintechs with thousands of
#                   unrelated postings). Default: all.
#
# Board slugs were resolved against the public ATS directories
# (github.com/Feashliaa/job-board-aggregator) and probed live on 2026-09-29.

companies:
